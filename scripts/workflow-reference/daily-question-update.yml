name: Daily Python Question Update

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 Beijing time)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch signals and generate exercises
        id: fetch
        run: |
          python scripts/daily_question_update.py 2>&1 | tee /tmp/update_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Import into curated question bank
        id: import
        run: |
          python scripts/import_to_curated_bank.py 2>&1 | tee /tmp/import_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git config user.name "pystart-bot"
          git config user.email "pystart-bot@users.noreply.github.com"

          # Stage relevant files
          git add data/latest_python_questions.json
          git add question_banks/curated-v2/question_bank.json

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "chore: daily question bank update ${DATE}

            Automated update from web trend signals.
            See data/latest_python_questions.json for details."
            git push
            echo "Changes committed and pushed."
          fi

      - name: Upload update log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-log-${{ github.run_number }}
          path: |
            /tmp/update_output.txt
            /tmp/import_output.txt
            data/latest_python_questions.json
          retention-days: 7
