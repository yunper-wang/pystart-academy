name: Daily Question Bank Update

on:
  schedule:
    # Run daily at 06:00 UTC (14:00 Beijing time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch only, no import)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily question update
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/daily_question_update.py --dry-run
          else
            python3 scripts/daily_question_update.py
          fi

      - name: Validate question bank
        if: inputs.dry_run != 'true'
        run: |
          python3 scripts/validate_curated_question_bank.py || echo "Validation warnings (non-blocking)"

      - name: Commit and push changes
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all changed files
          git add data/latest_python_questions.json
          git add question_banks/

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: daily question bank update ${DATE}

            Auto-generated by GitHub Actions daily-question-update workflow.
            Signals fetched from GitHub, RSS feeds, and web sources."
            git push
          fi
